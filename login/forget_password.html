
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forgot Password</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>

        body {
            font-family: "DM Sans", sans-serif;
        }

        .title-font {
            font-family: "Playfair Display", serif;
        }

    </style>

</head>

<body class="min-h-screen bg-blue-50">

    <main class="min-h-screen px-5 py-10">

        <!-- Header -->

        <section class="text-center pt-10">

            <h1 class="title-font text-3xl font-bold text-black">
                Forgot Password
            </h1>

            <p class="mt-4 text-lg text-gray-600">
                Enter your email to reset your password.
            </p>

        </section>


        <!-- Form -->

        <form
            class="max-w-xl mx-auto mt-16"
            onsubmit="sendResetCode(event)"
        >

            <!-- Email -->

            <div
                class="h-16 bg-white rounded-[30px] flex items-center px-8"
            >

                <i
                    class="fa-regular fa-envelope text-blue-500 text-xl w-12"
                ></i>

                <input
                    id="email"
                    type="email"
                    placeholder="Email"
                    required
                    class="w-full outline-none bg-transparent text-base text-gray-700 placeholder-gray-500"
                >

            </div>


            <!-- Send Reset Code -->

            <button
                type="submit"
                class="w-full h-16 mt-12 rounded-[30px] bg-blue-500 hover:bg-blue-600 transition text-white text-lg font-semibold shadow-lg"
            >

                Send Reset Code

            </button>


            <!-- Back to Login -->

            <p
                class="text-center text-blue-500 text-base font-semibold mt-12 "
            >

                Remember your password?

                <a
                    href="login.html"
                    class="hover:underline"
                >
                    Login
                </a>

            </p>

        </form>

    </main>

</body>

</html>
