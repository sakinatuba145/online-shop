<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>
        body {
            font-family: "DM Sans", sans-serif;
        }

        .title-font {
            font-family: "Playfair Display", serif;
        }
    </style>
</head>

<body class="min-h-screen bg-blue-50">

    <main class="min-h-screen px-5 py-10">

        <!-- Header -->
        <section class="text-center pt-10">

            <h1 class="title-font text-3xl font-bold text-black">
                Welcome back
            </h1>

            <p class="mt-3 text-lg text-gray-600">
                Continue your learning journey
            </p>

        </section>

        <!-- Student / Teacher -->
        <div class="max-w-xl mx-auto mt-14">

            <div class="bg-white/70 rounded-[32px] p-2 flex">

                <!-- Student -->
                <button
                    id="studentBtn"
                    onclick="selectRole('student')"
                    class="flex-1 h-12 rounded-[25px] bg-blue-500 text-white flex items-center justify-center gap-3 text-lg font-semibold shadow-sm"
                >
                    <i class="fa-solid fa-graduation-cap"></i>
                    Student
                </button>

                <!-- Teacher -->
                <button
                    id="teacherBtn"
                    onclick="selectRole('teacher')"
                    class="flex-1 h-12 rounded-[25px] text-gray-500 flex items-center justify-center gap-3 text-lg font-semibold"
                >
                    <i class="fa-solid fa-user"></i>
                    Teacher
                </button>

            </div>

        </div>

        <!-- Form -->
        <form class="max-w-xl mx-auto mt-14">

            <!-- Email -->
            <div class="h-16 bg-white rounded-[30px] flex items-center px-8">

                <i class="fa-regular fa-envelope text-blue-500 text-xl w-12"></i>

                <input
                    type="email"
                    placeholder="Email"
                    class="w-full outline-none bg-transparent text-base text-gray-700 placeholder-gray-500"
                >

            </div>

            <!-- Password -->
            <div class="h-16 bg-white rounded-[30px] flex items-center px-8 mt-7">

                <i class="fa-solid fa-lock text-blue-500 text-xl w-12"></i>

                <input
                    id="password"
                    type="password"
                    placeholder="Password"
                    class="w-full outline-none bg-transparent text-base text-gray-700 placeholder-gray-500"
                >

                <button
                    type="button"
                    onclick="togglePassword()"
                    class="text-blue-500 text-lg ml-3"
                >
                    <i id="eyeIcon" class="fa-solid fa-eye-slash"></i>
                </button>

            </div>

            <!-- Forgot Password -->
            <div class="text-right mt-10">

                <a
                    href="forget_password.html"
                    class="text-blue-500 text-lg font-semibold hover:underline"
                >
                    Forgot password
                </a>

            </div>
            <!-- Login -->
    
            
            <a
    href="../home/amir.html"
    class="block w-full h-16 mt-10 rounded-[30px] bg-blue-500 hover:bg-blue-600 transition text-white text-xl font-semibold shadow-lg flex items-center justify-center"
>
    Login
</a>
            
            <!-- Register -->
            <p class="text-center text-blue-500 text-lg font-semibold mt-14">

                Don't have an account?

                <a
                    href="register.html"
                    class="hover:underline"
                >
                    Register
                </a>

            </p>

        </form>

    </main>

</body>
</html>
