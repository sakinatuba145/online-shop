<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>
        body {
            font-family: "DM Sans", sans-serif;
        }

        .title-font {
            font-family: "Playfair Display", serif;
        }
    </style>
</head>

<body class="min-h-screen bg-gradient-to-br from-sky-100 via-sky-200 to-blue-400">

    <main class="min-h-screen px-5 py-10">

        <!-- Header -->
        <section class="text-center pt-10">

            <h1 class="title-font text-5xl font-bold text-black">
                Welcome back
            </h1>

            <p class="mt-3 text-xl text-gray-600">
                Continue your learning journey
            </p>

        </section>


        <!-- Student / Teacher -->
        <div class="max-w-xl mx-auto mt-14">

            <div class="bg-white/70 rounded-[32px] p-2 flex">

                <!-- Student -->
                <button
                    id="studentBtn"
                    onclick="selectRole('student')"
                    class="flex-1 h-20 rounded-[25px] bg-blue-500 text-white flex items-center justify-center gap-3 text-xl font-semibold shadow-sm"
                >
                    <i class="fa-solid fa-graduation-cap"></i>
                    Student
                </button>

                <!-- Teacher -->
                <button
                    id="teacherBtn"
                    onclick="selectRole('teacher')"
                    class="flex-1 h-20 rounded-[25px] text-gray-500 flex items-center justify-center gap-3 text-xl font-semibold"
                >
                    <i class="fa-solid fa-user"></i>
                    Teacher
                </button>

            </div>

        </div>


        <!-- Form -->
        <form class="max-w-xl mx-auto mt-14">

            <!-- Email -->
            <div class="h-28 bg-white rounded-[30px] flex items-center px-8">

                <i class="fa-regular fa-envelope text-blue-500 text-3xl w-12"></i>

                <input
                    type="email"
                    placeholder="Email"
                    class="w-full outline-none bg-transparent text-xl text-gray-700 placeholder-gray-500"
                >

            </div>


            <!-- Password -->
            <div class="h-28 bg-white rounded-[30px] flex items-center px-8 mt-7">

                <i class="fa-solid fa-lock text-blue-500 text-3xl w-12"></i>

                <input
                    id="password"
                    type="password"
                    placeholder="Password"
                    class="w-full outline-none bg-transparent text-xl text-gray-700 placeholder-gray-500"
                >

                <button
                    type="button"
                    onclick="togglePassword()"
                    class="text-blue-500 text-2xl ml-3"
                >
                    <i id="eyeIcon" class="fa-solid fa-eye-slash"></i>
                </button>

            </div>


            <!-- Forgot Password -->
            <div class="text-right mt-10">

                <a
                    href="forget_password.html"
                    class="text-white text-xl font-semibold hover:underline"
                >
                    Forgot password
                </a>

            </div>
            <!-- Login -->
            <button
                type="submit"
                class="w-full h-28 mt-10 rounded-[30px] bg-blue-500 hover:bg-blue-600 transition text-white text-2xl font-semibold shadow-lg"
            >
                Login
            </button>


            <!-- Register -->
            <p class="text-center text-white text-xl font-semibold mt-14">

                Don't have an account?

                <a
                    href="register.html"
                    class="hover:underline"
                >
                    Register
                </a>

            </p>

        </form>

    </main>


    <script>

        function togglePassword() {

            const password = document.getElementById("password");
            const icon = document.getElementById("eyeIcon");

            if (password.type === "password") {

                password.type = "text";

                icon.classList.remove("fa-eye-slash");
                icon.classList.add("fa-eye");

            } else {

                password.type = "password";

                icon.classList.remove("fa-eye");
                icon.classList.add("fa-eye-slash");

            }

        }


        function selectRole(role) {

            const studentBtn = document.getElementById("studentBtn");
            const teacherBtn = document.getElementById("teacherBtn");

            if (role === "student") {

                studentBtn.classList.add(
                    "bg-blue-500",
                    "text-white"
                );

                studentBtn.classList.remove(
                    "text-gray-500"
                );

                teacherBtn.classList.remove(
                    "bg-blue-500",
                    "text-white"
                );

                teacherBtn.classList.add(
                    "text-gray-500"
                );

            } else {

                teacherBtn.classList.add(
                    "bg-blue-500",
                    "text-white"
                );

                teacherBtn.classList.remove(
                    "text-gray-500"
                );

                studentBtn.classList.remove(
                    "bg-blue-500",
                    "text-white"
                );

                studentBtn.classList.add(
                    "text-gray-500"
                );

            }

        }

    </script>

</body>
</html>
