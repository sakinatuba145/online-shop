<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>
        body {
            font-family: "DM Sans", sans-serif;
        }

        .title-font {
            font-family: "Playfair Display", serif;
        }
        body {
            background:
                radial-gradient(circle at 10% 5%, rgba(59,130,246,.30), transparent 38%),
                radial-gradient(circle at 92% 45%, rgba(129,140,248,.28), transparent 40%),
                radial-gradient(circle at 15% 95%, rgba(56,189,248,.28), transparent 40%),
                linear-gradient(180deg, #e6f0ff 0%, #f7faff 50%, #e3ecff 100%);
        }
        .spark {
            position: absolute;
            background: #bfdbfe;
            opacity: .85;
            clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%);
        }
    </style>

<body class="min-h-screen relative overflow-x-hidden">
<div class="spark" style="top: 60px; left: 20px; width: 70px; height: 70px;"></div>
<div class="spark" style="bottom: 90px; right: 20px; width: 90px; height: 90px;"></div>
  
    <main class="relative min-h-screen px-5 py-10">
        

        <!-- Header -->
        <section class="text-center pt-10">

    <h1 class="title-font text-3xl font-bold text-black">
        Welcome to Online Shop
    </h1>

    <p class="mt-3 text-lg text-gray-600">
        Login to start shopping
    </p>

        </section>

        <!-- Form -->
        <form class="max-w-xl mx-auto mt-14">

            <!-- Email -->
            <div class="h-16 bg-white rounded-[30px] flex items-center px-8">

                <i class="fa-regular fa-envelope text-blue-500 text-xl w-12"></i>

                <input
                    type="email"
                    placeholder="Email"
                    class="w-full outline-none bg-transparent text-base text-gray-700 placeholder-gray-500"
                >

            </div>

            <!-- Password -->
            <div class="h-16 bg-white rounded-[30px] flex items-center px-8 mt-7">

                <i class="fa-solid fa-lock text-blue-500 text-xl w-12"></i>

                <input
                    id="password"
                    type="password"
                    placeholder="Password"
                    class="w-full outline-none bg-transparent text-base text-gray-700 placeholder-gray-500"
                >

                <button
                    type="button"
                    onclick="togglePassword()"
                    class="text-blue-500 text-lg ml-3"
                >
                    <i id="eyeIcon" class="fa-solid fa-eye-slash"></i>
                </button>

            </div>

            <!-- Forgot Password -->
            <div class="text-right mt-10">

                <a
                    href="forget_password.html"
                    class="text-blue-500 text-lg font-semibold hover:underline"
                >
                    Forgot password
                </a>

            </div>
            <!-- Login -->
    
            
            <a
    href="../home/amir.html"
    class="block w-full h-16 mt-10 rounded-[30px] bg-blue-500 hover:bg-blue-600 transition text-white text-xl font-semibold shadow-lg flex items-center justify-center"
>
    Login
</a>
            
            <!-- Register -->
            <p class="text-center text-blue-500 text-lg font-semibold mt-14">

                Don't have an account?

                <a
                    href="register.html"
                    class="hover:underline"
                >
                    Register
                </a>

            </p>

        </form>

    </main>

</body>
</html>
