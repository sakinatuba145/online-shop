
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Create Account</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: "DM Sans", sans-serif;
      }

      .title-font {
        font-family: "Playfair Display", serif;
      }
    </style>
  </head>

  <body
    class="min-h-screen bg-blue-50"
  >
    <main class="min-h-screen px-5 py-10">
      <!-- Header -->
      <section class="text-center pt-5">
        <h1 class="title-font text-3xl text-black">Create Account</h1>

        <p class="mt-4 text-lg text-gray-600">
          Start your learning journey today
        </p>
      </section>

      <!-- Form -->
      <form class="max-w-xl mx-auto mt-16">
        <!-- Full Name -->
        <div class="h-16 bg-white rounded-[30px] flex items-center px-8">
          <i class="fa-solid fa-user text-blue-500 text-xl w-12"></i>

          <input
            type="text"
            placeholder="Full name"
            class="w-full outline-none bg-transparent text-lg text-gray-700 placeholder-gray-500"
          />
        </div>

        <!-- Email -->
        <div class="h-16 bg-white rounded-[30px] flex items-center px-8 mt-7">
          <i class="fa-regular fa-envelope text-blue-500 text-xl w-12"></i>

          <input
            type="email"
            placeholder="Email"
            class="w-full outline-none bg-transparent text-lg text-gray-700 placeholder-gray-500"
          />
        </div>

        <!-- Password -->
        <div class="h-16 bg-white rounded-[30px] flex items-center px-8 mt-7">
          <i class="fa-solid fa-lock text-blue-500 text-xl w-12"></i>

          <input
            id="password"
            type="password"
            placeholder="Password"
            class="w-full outline-none bg-transparent text-lg text-gray-700 placeholder-gray-500"
          />

          <button
            type="button"
            onclick="togglePassword()"
            class="text-blue-500 text-xl ml-3"
          >
            <i id="eyeIcon" class="fa-solid fa-eye-slash"></i>
          </button>
        </div>

        <!-- Role -->
        <div class="h-16 bg-white rounded-[30px] flex items-center px-8 mt-7">
          <i class="fa-solid fa-graduation-cap text-blue-500 text-xl w-12"></i>

          <select
            class="w-full outline-none bg-transparent text-lg title-font font-semibold text-black appearance-none cursor-pointer"
          >
            <option>Student</option>

            <option>Teacher</option>
          </select>

          <i class="fa-solid fa-caret-down text-gray-600 text-xl">
            
          </i>
        </div>

        <!-- Create Account -->
        <button
          type="submit"
          class="w-full h-16 mt-12 rounded-[30px] bg-blue-500 hover:bg-blue-600 transition text-white text-lg font-semibold shadow-lg"
        >
          Create Account
        </button>

        <!-- OR -->
        <div class="flex items-center gap-5 my-10">
          <div class="flex-1 h-px bg-white/80"></div>

          <span class="text-gray-600 text-xl"> Or </span>

          <div class="flex-1 h-px bg-white/80"></div>
        </div>

        <!-- Google -->
        <button
          type="button"
          class="w-full h-16 rounded-[30px] bg-blue-500 hover:bg-blue-600 transition text-white text-lg font-semibold flex items-center justify-center gap-5 shadow-lg"
        >
          <span class="font-bold"> G </span>

          Continue with Google
        </button>

        <!-- Login -->
        <p class="text-center text-blue-500 text-lg font-semibold mt-14">
          Already have an account?

          <a href="login.html" class="hover:underline"> Login </a>
        </p>
      </form>
    </main>
  </body>
</html>
